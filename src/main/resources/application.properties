spring.application.name=tickethub

# Keep local profile to enable local seed data from DataInitializer.
spring.profiles.active=local

# Database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tickethub?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT settings
app.jwt.secret=${JWT_SECRET:2d37433ea66c10c339b70d3d9f7a34dd4db9e187dbc78b5f47ca43bf4fe9b7098df0d43551a3c2eafefac1a98c004df5989b5dcb3cd286895359622ed829226e}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
